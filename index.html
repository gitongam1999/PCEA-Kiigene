<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCEA Kiigene Church</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --purple-900:#2d1b4e;
  --purple-800:#3d2566;
  --purple-700:#4b2e83;
  --purple-600:#5f3da3;
  --purple-50:#f4f0fa;
  /* fixed header/drawer/footer palette — same on every page */
  --hdr-900:#062a55;
  --hdr-800:#0b3c7a;
  --hdr-700:#12509c;
  --hdr-50:#eaf1fb;
  /* per-page accent — swapped by JS per route, defaults to the header blue */
  --accent:#12509c;
  --accent-dark:#0b3c7a;
  --accent-light:#e5eefb;
  --accent-dark-rgb:11,60,122;
  --red:#d93a1c;
  --flame:#f26a1b;
  --gold:#f2b705;
  --page:#f5f4f7;
  --surface:#ffffff;
  --line:#e4e1e9;
  --text:#191320;
  --text-2:#514a5c;
  --text-3:#857d91;
  --header-h:60px;
  --nav-h:48px;
  --radius:12px;
  --shadow:0 1px 2px rgba(25,19,32,.06),0 4px 14px rgba(25,19,32,.07);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --page:#120f17;--surface:#1b1722;--line:#2c2636;--text:#f1eef6;
    --text-2:#b3abc0;--text-3:#857d91;--purple-50:#241c36;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --page:#120f17;--surface:#1b1722;--line:#2c2636;--text:#f1eef6;
  --text-2:#b3abc0;--text-3:#857d91;--purple-50:#241c36;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.icon{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-sm{width:16px;height:16px}

/* ---------- header ---------- */
.header{position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:60;
  background:linear-gradient(180deg,var(--hdr-800),var(--hdr-900));
  color:#fff;display:flex;align-items:center;gap:12px;padding:0 12px;
  border-bottom:2px solid var(--gold)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  color:#fff;transition:background .15s;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.14)}
.iconbtn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.brand-name{font-family:var(--serif);font-size:16.5px;font-weight:700;line-height:1.05;white-space:nowrap}
.brand-sub{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--gold);line-height:1.3}
.search{flex:1;max-width:480px;margin:0 auto;position:relative}
.search input{width:100%;height:37px;border-radius:19px;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.12);color:#fff;padding:0 14px 0 40px;font-size:14px;outline:none}
.search input::placeholder{color:rgba(255,255,255,.7)}
.search input:focus{background:rgba(255,255,255,.2);border-color:var(--gold)}
.search .icon{position:absolute;left:12px;top:9px;color:rgba(255,255,255,.85)}
.header-right{display:flex;align-items:center;gap:1px;margin-left:auto}
.dot{position:relative}
.dot::after{content:"";position:absolute;top:9px;right:9px;width:7px;height:7px;
  border-radius:50%;background:var(--gold);border:1.5px solid var(--hdr-900)}
.avatar{width:32px;height:32px;border-radius:50%;
  background:linear-gradient(140deg,var(--flame),var(--red));
  display:grid;place-items:center;color:#fff;border:1.5px solid rgba(255,255,255,.45)}
.avatar .icon{width:17px;height:17px;stroke-width:2}
.search-toggle{display:none}

/* ---------- ministry nav ---------- */
.ministry{position:fixed;top:var(--header-h);left:0;right:0;height:var(--nav-h);z-index:55;
  background:var(--surface);border-bottom:1px solid var(--line)}
.ministry-inner{height:100%;max-width:1180px;margin:0 auto;padding:0 10px;
  display:flex;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:none}
.ministry-inner::-webkit-scrollbar{display:none}
.mlink{display:flex;align-items:center;padding:0 14px;white-space:nowrap;font-size:14px;
  font-weight:500;color:var(--text-2);border-bottom:2.5px solid transparent;transition:color .15s}
.mlink:hover{color:var(--accent)}
.mlink.active{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(25,19,32,.55);z-index:80;
  opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}
.scrim.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;left:0;bottom:0;width:286px;max-width:84vw;z-index:90;
  background:var(--surface);border-right:1px solid var(--line);transform:translateX(-100%);
  transition:transform .26s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-top{height:var(--header-h);display:flex;align-items:center;gap:10px;
  padding:0 10px;border-bottom:1px solid var(--line)}
.drawer-title{font-family:var(--serif);font-weight:700;font-size:16px}
.drawer-nav{padding:10px 8px;overflow-y:auto;flex:1}
.dgroup{padding:14px 14px 6px;font-size:11px;letter-spacing:1px;text-transform:uppercase;
  color:var(--text-3);font-weight:600}
.dlink{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:9px;
  color:var(--text-2);font-size:14.5px;font-weight:500;transition:background .13s,color .13s}
.dlink:hover{background:var(--hdr-50);color:var(--hdr-700)}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3)}

/* ---------- layout ---------- */
.page{padding-top:calc(var(--header-h) + var(--nav-h));min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* ---------- cover ---------- */
.cover{position:relative;height:clamp(200px,34vw,380px);overflow:hidden}
.cover .ph{position:absolute;inset:0}
.cover-fade{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(var(--accent-dark-rgb),.12),rgba(var(--accent-dark-rgb),.3) 45%,rgba(var(--accent-dark-rgb),.84))}
.cover-cap{position:absolute;left:0;right:0;bottom:0;color:#fff;padding-bottom:18px}
.cover-cap .eyebrow{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;
  font-weight:700;color:var(--gold);margin-bottom:5px}
.cover-cap h1{font-family:var(--serif);font-size:clamp(23px,4.4vw,40px);margin:0 0 5px;
  font-weight:700;letter-spacing:-.3px;text-shadow:0 1px 14px rgba(0,0,0,.4)}
.cover-cap p{margin:0;font-size:clamp(13px,1.6vw,16px);color:rgba(255,255,255,.9);max-width:640px}

/* ---------- identity ---------- */
.identity{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-top:-40px;position:relative;z-index:2;padding:20px;
  display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.id-crest{width:86px;height:86px;flex:none;margin-top:-46px;background:var(--surface);
  border-radius:16px;border:3px solid var(--surface);box-shadow:var(--shadow);
  display:grid;place-items:center;padding:6px}
.id-crest img{width:100%;height:100%;object-fit:contain}
.id-main{flex:1;min-width:230px}
.id-main h2{font-family:var(--serif);font-size:21px;margin:0 0 10px;letter-spacing:-.2px}
.id-facts{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--text-2);font-size:13.5px}
.id-facts span{display:flex;align-items:center;gap:7px}
.id-facts .icon{color:var(--accent)}
.id-actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;
  padding:0 16px;border-radius:19px;font-size:14px;font-weight:600;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark)}
.btn-flame{background:linear-gradient(140deg,var(--flame),var(--red));color:#fff}
.btn-flame:hover{filter:brightness(1.07)}
.btn-ghost{border:1px solid var(--line);color:var(--text-2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{height:32px;padding:0 13px;font-size:13px;border-radius:16px}

/* ---------- sections ---------- */
section{padding:32px 0 4px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
.sec-head h3{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;
  color:var(--accent);margin:0}
.sec-head .rule{flex:1;height:1px;background:var(--line)}
.sec-head .more{font-size:13px;font-weight:600;color:var(--text-3)}
.sec-head .more:hover{color:var(--accent)}
.grid{display:grid;gap:16px}
.g-events{grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
.g-videos{grid-template-columns:repeat(auto-fill,minmax(288px,1fr))}
.g-photos{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.g-min{grid-template-columns:repeat(auto-fill,minmax(265px,1fr))}
.g-sermons{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.g-people{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.16s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(25,19,32,.13)}
.card-body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h4{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.1px}
.card p{margin:0;font-size:13.5px;color:var(--text-2)}
.meta{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-3);font-weight:500}
.card-foot{margin-top:auto;padding-top:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--accent)}
.link:hover{gap:9px}
.link.muted{color:var(--text-3);font-weight:500}
.link.muted:hover{color:var(--accent)}

.thumb{position:relative;aspect-ratio:16/9;overflow:hidden}
.thumb.sq{aspect-ratio:1}
.ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.55)}
.ph svg{width:30px;height:30px}
.play{position:absolute;inset:0;display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(var(--accent-dark-rgb),0),rgba(var(--accent-dark-rgb),.35))}
.play span{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.95);
  display:grid;place-items:center;color:var(--red);box-shadow:0 3px 14px rgba(0,0,0,.3)}
.play svg{width:20px;height:20px;fill:currentColor;stroke:none;margin-left:2px}
.chip{position:absolute;top:10px;left:10px;background:rgba(var(--accent-dark-rgb),.9);color:#fff;
  font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  padding:4px 9px;border-radius:5px}
.count{position:absolute;bottom:8px;right:8px;background:rgba(var(--accent-dark-rgb),.9);color:#fff;
  font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:5px}
.datebox{position:absolute;top:10px;right:10px;background:var(--surface);border-radius:8px;
  text-align:center;padding:6px 10px;line-height:1.05;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.datebox b{display:block;font-size:17px;font-weight:700;color:var(--red)}
.datebox i{display:block;font-size:10px;font-style:normal;text-transform:uppercase;
  letter-spacing:.7px;color:var(--text-3);font-weight:600}
.mincard .kicker{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
  font-weight:700;color:var(--accent)}
.sermon{flex-direction:row}
.sermon .sicon{width:62px;flex:none;background:var(--accent-light);display:grid;place-items:center;
  color:var(--accent);border-right:1px solid var(--line)}

/* people */
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);text-align:center}
.person .ph{position:relative;aspect-ratio:1}
.person .pbody{padding:12px 10px 15px}
.person h4{margin:0 0 2px;font-size:15px}
.person .role{font-size:12px;letter-spacing:.9px;text-transform:uppercase;
  color:var(--red);font-weight:700}
.person .note{font-size:12.5px;color:var(--text-3);margin-top:5px}

/* prose */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px}
.panel h3{margin:0 0 10px;font-family:var(--serif);font-size:19px}
.panel p{margin:0 0 10px;color:var(--text-2)}
.split{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.factlist{list-style:none;margin:0;padding:0}
.factlist li{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);
  font-size:14px;color:var(--text-2)}
.factlist li:last-child{border-bottom:0}
.factlist .icon{color:var(--accent);margin-top:2px}

/* ---------- admin ---------- */
.admin-shell{max-width:1180px;margin:0 auto;padding:22px 18px 40px}
.admin-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.admin-top h2{font-family:var(--serif);margin:0;font-size:22px}
.badge{background:var(--accent-light);color:var(--accent);font-size:11.5px;font-weight:700;
  letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border-radius:20px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 15px;border-radius:20px;font-size:13.5px;font-weight:600;color:var(--text-2);
  border:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border-radius:9px;
  border:1px solid var(--line);background:var(--page);outline:none;font-size:14px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple-600)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;
  color:var(--text-3);font-size:13px;background:var(--page)}
.rowitem{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface);margin-bottom:9px}
.rowitem .sw{width:44px;height:34px;border-radius:7px;flex:none;position:relative;overflow:hidden}
.rowitem .t{flex:1;min-width:0}
.rowitem .t b{display:block;font-size:14px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .t span{font-size:12.5px;color:var(--text-3)}
.del{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  color:var(--text-3);border:1px solid var(--line)}
.del:hover{color:var(--red);border-color:var(--red)}
.login-card{max-width:380px;margin:60px auto;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);padding:26px}
.login-card .lg{width:60px;margin:0 auto 14px}
.login-card h2{text-align:center;font-family:var(--serif);margin:0 0 4px;font-size:20px}
.login-card .sub{text-align:center;color:var(--text-3);font-size:13px;margin-bottom:18px}
.note{background:var(--accent-light);border-left:3px solid var(--accent);padding:10px 12px;
  border-radius:0 8px 8px 0;font-size:12.5px;color:var(--text-2);margin-bottom:16px}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:120;
  background:var(--hdr-900);color:#fff;padding:11px 18px;border-radius:24px;font-size:13.5px;
  box-shadow:0 6px 24px rgba(0,0,0,.3);opacity:0;visibility:hidden;transition:.22s;max-width:90vw;text-align:center}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

footer{margin-top:44px;background:var(--hdr-900);color:rgba(255,255,255,.78);padding:28px 0 20px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
footer .fbrand{display:flex;align-items:center;gap:11px;color:#fff}
footer .fbrand img{width:32px}
footer .fname{font-family:var(--serif);font-weight:700;font-size:15px}
footer nav{display:flex;gap:17px;flex-wrap:wrap;font-size:13.5px}
footer nav a:hover{color:var(--gold)}
footer .copy{width:100%;border-top:1px solid rgba(255,255,255,.14);margin-top:16px;
  padding-top:13px;font-size:12.5px;color:rgba(255,255,255,.6)}

@media (max-width:760px){
  :root{--header-h:56px}
  .search{display:none}
  .search.mobile-open{display:block;position:absolute;left:8px;right:8px;top:8px;max-width:none;z-index:5}
  .search-toggle{display:grid}
  .brand-sub{display:none}
  .help-btn{display:none}
  .identity{margin-top:-28px;padding:16px}
  .id-crest{width:68px;height:68px;margin-top:-40px}
  .sermon{flex-direction:column}
  .sermon .sicon{width:100%;height:52px;border-right:0;border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>

<header class="header">
  <button class="iconbtn" id="menuBtn" aria-label="Open navigation menu" aria-expanded="false">
    <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>

<script>
/* =========================================================
   1. DATA — loaded from Supabase via /api/content.
   adapt() reshapes the API response into the same field names
   the render functions below already expect, so nothing past
   this block needs to know it's talking to a real database.
========================================================= */
let db = {church:{},ministries:[{id:"home",name:"Home"}],events:[],videos:[],albums:[],sermons:[],leaders:[]};

function hashNum(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
function fmtLen(sec){
  if(!sec&&sec!==0) return "—";
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return (h?h+":"+String(m).padStart(2,'0'):m) + ":" + String(s).padStart(2,'0');
}
function fmtDate(d){
  if(!d) return "—";
  const dt=new Date(d+"T00:00:00");
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function dayMon(d){
  if(!d) return {day:"–",mon:"–"};
  const dt=new Date(d+"T00:00:00");
  if(isNaN(dt)) return {day:"–",mon:"–"};
  return {day:String(dt.getDate()).padStart(2,'0'), mon:dt.toLocaleDateString('en-GB',{month:'short'})};
}

function adapt(api){
  const minsById={};
  const ministries=[{id:"home",name:"Home"}].concat((api.ministries||[]).map(m=>{
    minsById[m.id]=m;
    return {
      id:m.id, name:m.name, fullName:m.full_name, officialUrl:m.official_url,
      cover:hashNum(m.id), tagline:m.tagline, about:m.about, meets:m.meets, leader:m.leader
    };
  }));
  const minName=id => (minsById[id] && minsById[id].name) || id || "";

  const albumCounts={};
  (api.photos||[]).forEach(p=>{ albumCounts[p.album_id]=(albumCounts[p.album_id]||0)+1; });

  return {
    church: api.church || {},
    ministries,
    events:(api.events||[]).map(e=>{
      const dm=dayMon(e.event_date);
      return {id:e.id, ministry:minName(e.ministry_id), title:e.title, day:dm.day, mon:dm.mon,
        time:e.event_time||"", place:e.place||"", desc:e.description||""};
    }),
    videos:(api.videos||[]).map(v=>({
      id:v.id, ministry:minName(v.ministry_id), title:v.title,
      len:fmtLen(v.length_seconds), desc:v.description||""
    })),
    albums:(api.albums||[]).map(a=>({
      id:a.id, ministry:minName(a.ministry_id), title:a.title, count:albumCounts[a.id]||0
    })),
    sermons:(api.sermons||[]).map(s=>({
      id:s.id, title:s.title, who:s.preacher||"", date:fmtDate(s.sermon_date), len:"" 
    })),
    leaders:(api.leaders||[]).map(l=>({id:l.id,name:l.name,role:l.role,note:l.note||""}))
  };
}

async function boot(){
  try{
    const r = await fetch('/api/content');
    const data = await r.json();
    if(!data.ok) throw new Error(data.error||'Unknown error');
    db = adapt(data);
  }catch(err){
    document.getElementById('app').innerHTML =
      `<div class="wrap"><section><div class="panel">
        <h3>Could not load the site</h3>
        <p>${err.message}</p></div></section></div>`;
    return;
  }
  buildNav(); render();
}

function cover(idx,eyebrow,title,sub){
  return `<div class="cover">${ph(idx)}<div class="cover-fade"></div>
    <div class="cover-cap"><div class="wrap">
      ${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}
      <h1>${title}</h1>${sub?`<p>${sub}</p>`:''}
    </div></div></div>`;
}
function secHead(t,more){
  return `<div class="sec-head"><h3>${t}</h3><span class="rule"></span>
    ${more?`<a class="more" href="${more[1]}">${more[0]}</a>`:''}</div>`;
}
function eventCard(e,i){
  return `<article class="card">
    <div class="thumb">${ph(i+hashNum(String(e.id)))}<span class="chip">${e.ministry}</span>
      <span class="datebox"><b>${e.day}</b><i>${e.mon}</i></span></div>
    <div class="card-body"><h4>${e.title}</h4>
      <div class="meta"><svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/>

      <p>${e.desc||''}</p>

}

function pageLeadership(){
  return cover(7,"Our Team","Church Leadership","The people serving Kiigene Church this term.")
  + `<div class="wrap"><section>
    ${secHead("Church Committee")}
    <div class="grid g-people">${db.leaders.map((p,i)=>`
      <div class="person"><div class="ph-wrap">${phPerson(i)}</div>
        <div class="pbody"><div class="role">${p.role}</div>
          <h4>${p.name}</h4>${p.note?`<div class="note">${p.note}</div>`:''}</div></div>`).join('')}
    </div></section>
    <section><div class="panel"><h3>Get in touch</h3>
      <p>To reach any member of the leadership team, call ${db.church.phone} or email ${db.church.email}.</p>
      <a class="btn btn-primary" href="#/contact">Contact the church office</a></div></section>
  </div>`;
}

function listPage(kind){
  const map={
    events:["Events","All Events",()=>`<div class="grid g-events">${db.events.map(eventCard).join('')}</div>`],
    videos:["Videos","All Videos",()=>`<div class="grid g-videos">${db.videos.map(videoCard).join('')}</div>`],
    photos:["Photos","Photo Albums",()=>`<div class="grid g-photos">${db.albums.map(albumCard).join('')}</div>`],
    sermons:["Sermons","Sermon Archive",()=>`<div class="grid g-sermons">${db.sermons.map(sermonCard).join('')}</div>`]
  };
  const [eyebrow,title,body]=map[kind];
  return cover(kind.length,eyebrow,title,"") +
    `<div class="wrap"><section>${body()}</section></div>`;
}

function pageAbout(){
  return cover(3,"Our Story","About Kiigene Church","")
  +`<div class="wrap"><section><div class="split">
    <div class="panel"><h3>Who we are</h3>
      <p>PCEA Kiigene Church is a congregation of the Presbyterian Church of East Africa, serving
      the Kiigene community in Meru County. We gather every Sunday to worship, and through the week
      in our fellowships and ministries.</p>
      <p>Replace this text from the admin dashboard with the true history of the parish — when it
      was founded, the ministers who have served, and how the congregation has grown.</p></div>
    <div class="panel"><h3>Faith &middot; Love &middot; Hope</h3>
      <p>The words at the foot of our crest. The flame represents the Holy Spirit, the cross our
      Lord Jesus Christ, and the open book the word of God.</p></div>
  </div></section></div>`;
}

function pageSearch(q){
  const t=q.toLowerCase();
  const hit=a=>a.filter(x=>JSON.stringify(x).toLowerCase().includes(t));
  const ev=hit(db.events),vd=hit(db.videos),al=hit(db.albums),sm=hit(db.sermons);
  const n=ev.length+vd.length+al.length+sm.length;
  return `<div class="wrap"><section>
    <h2 style="font-family:var(--serif);margin:0 0 4px">Search results</h2>
    <p style="color:var(--text-3);margin:0 0 20px">${n} result${n===1?'':'s'} for &ldquo;${q}&rdquo;</p>
    ${ev.length?secHead("Events")+`<div class="grid g-events">${ev.map(eventCard).join('')}</div>`:''}
    ${vd.length?secHead("Videos")+`<div class="grid g-videos">${vd.map(videoCard).join('')}</div>`:''}
    ${al.length?secHead("Photos")+`<div class="grid g-photos">${al.map(albumCard).join('')}</div>`:''}
    ${sm.length?secHead("Sermons")+`<div class="grid g-sermons">${sm.map(sermonCard).join('')}</div>`:''}
    ${n===0?`<div class="panel"><h3>Nothing found</h3><p>Try a ministry name, an event or a sermon title.</p></div>`:''}
  </section></div>`;
}
function page404(){
  return `<div class="wrap"><section><div class="panel">
    <h3>Page not found</h3><p>That page doesn't exist yet.</p>
    <a class="btn btn-primary" href="#/home">Back to home</a></div></section></div>`;
}

  r.setProperty('--accent-light',t.l); r.setProperty('--accent-dark-rgb',t.rgb);

function wire(){

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-toast]');
  if(t){e.preventDefault();toast(t.dataset.toast);}
});
let tTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(tTimer); tTimer=setTimeout(()=>el.classList.remove('show'),3400);
}

/* drawer + search */
const drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim'),
      menuBtn=document.getElementById('menuBtn');
const openD=()=>{drawer.classList.add('open');scrim.classList.add('open');
  drawer.setAttribute('aria-hidden','false');menuBtn.setAttribute('aria-expanded','true');};
const closeD=()=>{drawer.classList.remove('open');scrim.classList.remove('open');
  drawer.setAttribute('aria-hidden','true');menuBtn.setAttribute('aria-expanded','false');};
menuBtn.onclick=openD; document.getElementById('closeBtn').onclick=closeD; scrim.onclick=closeD;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD();});
drawer.addEventListener('click',e=>{if(e.target.closest('a'))closeD();});
document.getElementById('searchToggle').onclick=()=>{
  const b=document.getElementById('searchBox'); b.classList.toggle('mobile-open');
  if(b.classList.contains('mobile-open')) document.getElementById('searchInput').focus();
};
document.getElementById('searchInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.value.trim()){
    location.hash='#/search?q='+encodeURIComponent(e.target.value.trim());
    document.getElementById('searchBox').classList.remove('mobile-open');
  }
});

window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render();});
boot();
