<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — PCEA Kiigene Church</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;
    background:#f5f4f7;font-family:system-ui,-apple-system,Arial,sans-serif}
  .card{width:340px;max-width:90vw;background:#fff;border:1px solid #e4e1e9;
    border-radius:14px;box-shadow:0 4px 16px rgba(25,19,32,.08);padding:26px}
  h1{font-size:19px;margin:0 0 4px;text-align:center}
  .sub{text-align:center;color:#857d91;font-size:13px;margin-bottom:18px}
  label{display:block;font-size:12.5px;font-weight:600;color:#514a5c;margin:12px 0 5px}
  input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:9px;
    border:1px solid #e4e1e9;font-size:14px;outline:none}
  input:focus{border-color:#4b2e83}
  button{width:100%;margin-top:18px;height:40px;border:0;border-radius:20px;
    background:#4b2e83;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6}
  .err{background:#fdecea;color:#7a1f1f;border-left:3px solid #d93a1c;
    padding:9px 11px;border-radius:0 8px 8px 0;font-size:13px;margin-top:14px}
</style>
</head>
<body>
  <div class="card">
    <h1>Church Admin</h1>
    <div class="sub">PCEA Kiigene Church</div>
    <label>Email</label>
    <input id="email" type="email" autocomplete="username">
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="btn">Sign in</button>
    <div id="err" style="display:none" class="err"></div>
  </div>
<script>
document.getElementById('btn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const r = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await r.json();
    if (!data.ok) {
      err.textContent = data.error || 'Sign in failed.';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Sign in';
      return;
    }
    window.location.href = '/admin-dashboard';
  } catch (e) {
    err.textContent = 'Could not reach the server.';
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn').click();
});
</script>
</body>
</html>
